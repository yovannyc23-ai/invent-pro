<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Tech S&S - Sistema Profesional de Caja e Inventario</title>
  <link rel="manifest" href="manifest.json">
  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase & SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root { --bg-main: #f8fafc; --text-main: #1e293b; --primary: #0284c7; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; }
    .sidebar { min-height: 100vh; background: #1e293b; color: white; }
    .nav-link { color: #94a3b8; cursor: pointer; }
    .nav-link.active, .nav-link:hover { color: white; background: #0284c7; border-radius: 8px; }
    
    @media print {
      body * { visibility: hidden !important; }
      #area-impresion, #area-impresion * { visibility: visible !important; }
      #area-impresion {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 80mm !important;
        margin: 0 !important;
        padding: 5px !important;
        background: white !important;
        display: block !important;
      }
      @page { size: 80mm auto; margin: 0mm; }
    }
  </style>
</head>
<body>

  <!-- LOGIN OVERLAY SEGURO -->
  <div id="login-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); display: flex; justify-content: center; align-items: center; z-index: 9999;">
    <div style="background: white; padding: 40px; border-radius: 16px; text-align: center; width: 360px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);">
      <h2 style="color: #0284c7; font-weight: bold; margin-bottom: 5px;">Z-Tech S&S</h2>
      <p style="color:#64748b; font-size:0.95rem; margin-bottom:25px;">Sistema Profesional de Caja</p>
      <input type="password" id="pin-input" placeholder="••••" style="text-align:center; font-size:1.4rem; margin-bottom:20px; letter-spacing: 6px; width:100%; padding:12px; border: 2px solid #cbd5e1; border-radius: 8px;" maxlength="4">
      <button type="button" onclick="autenticarFuerza()" style="width:100%; padding: 14px; background-color: #0284c7; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;">Iniciar Sesión</button>
    </div>
  </div>

  <!-- INTERFAZ PRINCIPAL -->
  <div id="app-container" style="display: none;" class="container-fluid">
    <div class="row">
      <!-- Barra Lateral -->
      <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
        <h4 class="text-white mb-4"><i class="fas fa-boxes text-info"></i> Z-Tech S&S</h4>
        <ul class="nav flex-column gap-2">
          <li class="nav-item"><a class="nav-link active" onclick="cambiarPestana('seccion-pos', this)"><i class="fas fa-cash-register me-2"></i> POS / Caja</a></li>
          <li class="nav-item"><a class="nav-link" onclick="cambiarPestana('seccion-inventario', this)"><i class="fas fa-box-open me-2"></i> Inventario</a></li>
          <li class="nav-item"><a class="nav-link" onclick="cambiarPestana('seccion-proveedores', this)"><i class="fas fa-truck me-2"></i> Proveedores</a></li>
          <li class="nav-item"><a class="nav-link" onclick="cambiarPestana('seccion-gastos', this)"><i class="fas fa-wallet me-2"></i> Gastos y Caja</a></li>
          <li class="nav-item"><a class="nav-link" onclick="cambiarPestana('seccion-pagos', this)"><i class="fas fa-mobile-alt me-2"></i> Pagos Digitales</a></li>
        </ul>
        <hr class="text-secondary my-4">
        <div class="small text-muted">
          <span id="user-role-label" class="badge bg-info text-dark mb-2">Rol: Invitado</span>
          <button class="btn btn-outline-danger btn-sm w-100 mt-2" onclick="cerrarSesion()"><i class="fas fa-sign-out-alt me-1"></i> Salir</button>
        </div>
      </nav>

      <!-- Contenido Principal -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        
        <!-- POS / CAJA -->
        <div id="seccion-pos" class="contenido-seccion">
          <h2 class="mb-3 text-primary"><i class="fas fa-cash-register"></i> Punto de Venta (POS) - Z-Tech S&S</h2>
          <div class="row">
            <div class="col-md-8">
              <div class="card p-3 shadow-sm mb-3">
                <input type="text" id="busqueda-pos" class="form-control form-control-lg" placeholder="Escanear código de barras o buscar producto..." oninput="filtrarPOS(this.value)">
              </div>
              <div id="grid-productos" class="row g-3" style="max-height: 60vh; overflow-y: auto;"></div>
            </div>
            <div class="col-md-4">
              <div class="card p-3 shadow-sm">
                <h4>Factura Actual</h4>
                <hr>
                <div id="lista-carrito" style="min-height: 150px; max-height: 220px; overflow-y: auto;">
                  <p class="text-muted text-center">Carrito vacío</p>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-3">
                  <h5>Total:</h5>
                  <h5 id="total-carrito" class="text-success">$0</h5>
                </div>
                <label class="form-label fw-bold">Método de Pago:</label>
                <select id="metodo-pago" class="form-select mb-3">
                  <option value="Efectivo">Efectivo</option>
                  <option value="Nequi">Nequi</option>
                  <option value="Bancolombia A la Mano">Bancolombia A la Mano</option>
                  <option value="Daviplata">Daviplata</option>
                </select>
                <button class="btn btn-success w-100 py-2 fw-bold mb-2" onclick="procesarVentaSupabase()"><i class="fas fa-check-circle me-1"></i> Cobrar y Facturar</button>
                <button class="btn btn-outline-secondary w-100 btn-sm" onclick="imprimirUltimaFactura()"><i class="fas fa-print me-1"></i> Imprimir Tiquete</button>
              </div>
            </div>
          </div>
        </div>

        <!-- INVENTARIO -->
        <div id="seccion-inventario" class="contenido-seccion" style="display: none;">
          <h2 class="mb-3 text-primary"><i class="fas fa-box-open"></i> Gestión de Inventario</h2>
          <div class="card p-3 shadow-sm mb-3">
            <h5>Registrar / Ing
